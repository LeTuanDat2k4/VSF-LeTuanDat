version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: return-prediction-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: return-prediction-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/model_artifact
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
